name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest ruff mypy
      - run: python -m pytest -q -p no:cacheprovider
      - run: ruff check pipeline_audit.py excel_lineage.py sec_data_cli.py review_luna tests tools
      - run: mypy --ignore-missing-imports pipeline_audit.py excel_lineage.py sec_data_cli.py
